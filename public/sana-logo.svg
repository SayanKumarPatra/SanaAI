<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="outerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <radialGradient id="innerBadgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="90%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Glowing Neon Orange Ring Gradients -->
    <linearGradient id="neonOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="30%" stop-color="#fb8500"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <radialGradient id="skinGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="65%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>

    <!-- Filters for 3D Glow & Shadows -->
    <filter id="superNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Square Dark Background Canvas -->
  <rect width="1000" height="1000" fill="url(#outerBg)" />

  <!-- Outer Dark Circular Bevel Frame -->
  <circle cx="500" cy="500" r="460" fill="#090d16" stroke="#1e293b" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- Inner Badge Plate -->
  <circle cx="500" cy="500" r="440" fill="url(#innerBadgeBg)"/>

  <!-- Glowing Neon Outer Orange Ring -->
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#neonOrangeGrad)" stroke-width="22" filter="url(#superNeonGlow)"/>
  <circle cx="500" cy="500" r="416" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
  <circle cx="500" cy="500" r="444" fill="none" stroke="#fb8500" stroke-width="4" opacity="0.6"/>

  <!-- LEFT 3D SPEECH BUBBLE WITH 3 GLOWING DOTS -->
  <g transform="translate(150, 360)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="160" height="120" rx="36" fill="#111827" stroke="#374151" stroke-width="6"/>
    <rect x="4" y="4" width="152" height="112" rx="32" fill="none" stroke="url(#neonOrangeGrad)" stroke-width="3" opacity="0.8" filter="url(#softGlow)"/>
    <!-- Tail -->
    <path d="M 40 120 L 20 150 L 70 120 Z" fill="#111827" stroke="#374151" stroke-width="6"/>
    <!-- 3 Glowing Yellow Dots -->
    <circle cx="45" cy="60" r="12" fill="#fbbf24" filter="url(#softGlow)"/>
    <circle cx="80" cy="60" r="12" fill="#fbbf24" filter="url(#softGlow)"/>
    <circle cx="115" cy="60" r="12" fill="#fbbf24" filter="url(#softGlow)"/>
  </g>

  <!-- RIGHT 3D GLOSSY 'S' BADGE WITH GLOW -->
  <g transform="translate(680, 360)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="160" height="160" rx="44" fill="#111827" stroke="#374151" stroke-width="6"/>
    <rect x="4" y="4" width="152" height="152" rx="40" fill="none" stroke="url(#neonOrangeGrad)" stroke-width="4" filter="url(#softGlow)"/>
    <text x="80" y="115" fill="#f97316" font-size="110" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif" filter="url(#superNeonGlow)">S</text>
    <text x="80" y="115" fill="#fff" font-size="110" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif">S</text>
  </g>

  <!-- CENTER CHARACTER AVATAR (SANA) -->
  <g transform="translate(220, 100)" filter="url(#dropShadow)">
    <!-- Back Hair & High Ponytail -->
    <path d="M 280 80 C 400 30 480 90 460 260 C 440 320 380 340 340 300 Z" fill="#0b0f19" stroke="#1f293d" stroke-width="4"/>
    <path d="M 280 120 C 120 120 100 220 100 380 C 100 480 150 540 220 570 L 340 570 C 410 540 460 480 460 380 C 460 220 440 120 280 120 Z" fill="#0d1322"/>

    <!-- Hoodie / Shoulders -->
    <path d="M 80 520 C 120 440 200 410 280 410 C 360 410 440 440 480 520 L 510 650 C 420 680 140 680 50 650 Z" fill="#131b2e" stroke="#2a364f" stroke-width="6"/>
    <!-- Hoodie String & Orange SANA Text on Chest -->
    <path d="M 250 430 L 240 540" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <path d="M 310 430 L 320 540" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <text x="280" y="475" fill="#f97316" font-size="28" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif" letter-spacing="3">SANA</text>

    <!-- Neck & Face Skin -->
    <path d="M 230 400 L 230 460 C 250 480 310 480 330 460 L 330 400 Z" fill="#fecdd3"/>
    <ellipse cx="280" cy="310" rx="110" ry="130" fill="url(#skinGrad)"/>

    <!-- Hair Bangs Front -->
    <path d="M 170 280 C 190 200 260 180 280 250 C 300 180 380 200 390 280 C 340 220 220 220 170 280 Z" fill="#111827"/>
    <path d="M 170 270 C 140 330 150 400 180 420 C 180 360 180 310 200 270 Z" fill="#111827"/>
    <path d="M 390 270 C 420 330 410 400 380 420 C 380 360 380 310 360 270 Z" fill="#111827"/>

    <!-- Eyes (Big Warm Anime Style) -->
    <!-- Left Eye -->
    <ellipse cx="225" cy="305" rx="22" ry="30" fill="#1e1b18"/>
    <ellipse cx="225" cy="305" rx="18" ry="24" fill="#78350f"/>
    <circle cx="218" cy="295" r="8" fill="#ffffff"/>
    <circle cx="230" cy="315" r="4" fill="#ffffff"/>
    <!-- Right Eye -->
    <ellipse cx="335" cy="305" rx="22" ry="30" fill="#1e1b18"/>
    <ellipse cx="335" cy="305" rx="18" ry="24" fill="#78350f"/>
    <circle cx="328" cy="295" r="8" fill="#ffffff"/>
    <circle cx="340" cy="315" r="4" fill="#ffffff"/>

    <!-- Eyelashes & Brows -->
    <path d="M 195 275 Q 225 255 255 280" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 305 280 Q 335 255 365 275" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 205 250 Q 225 240 245 250" stroke="#451a03" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 315 250 Q 335 240 355 250" stroke="#451a03" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Cute Lip Smile -->
    <path d="M 258 365 Q 280 382 302 365" stroke="#e11d48" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- Professional Headset -->
    <path d="M 160 290 C 150 150 410 150 400 290" stroke="#111827" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- Left Earcup -->
    <rect x="145" y="260" width="35" height="80" rx="17" fill="#111827" stroke="#f97316" stroke-width="6"/>
    <!-- Right Earcup with glowing S -->
    <rect x="380" y="260" width="35" height="80" rx="17" fill="#111827" stroke="#f97316" stroke-width="6" filter="url(#softGlow)"/>
    <text x="397" y="312" fill="#fbbf24" font-size="32" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif">S</text>

    <!-- Headset Mic Boom -->
    <path d="M 390 320 C 390 390 310 405 310 395" stroke="#111827" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 390 320 C 390 390 310 405 310 395" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
    <circle cx="305" cy="395" r="12" fill="#111827" stroke="#f97316" stroke-width="4"/>
  </g>

  <!-- MAIN SANA TEXT BANNER & SUBTITLE BADGE -->
  <g transform="translate(180, 610)" filter="url(#dropShadow)">
    <!-- 3D White Bold SANA Text with Bevel -->
    <text x="320" y="115" fill="#0f172a" font-size="140" font-weight="900" text-anchor="middle" font-family="'Impact', 'Trebuchet MS', sans-serif" letter-spacing="12">SANA</text>
    <text x="320" y="110" fill="url(#goldTextGrad)" font-size="140" font-weight="900" text-anchor="middle" font-family="'Impact', 'Trebuchet MS', sans-serif" letter-spacing="12" stroke="#ffffff" stroke-width="4">SANA</text>

    <!-- Dark Plate for '3D AI VIRTUAL ASSISTANT' -->
    <rect x="20" y="130" width="600" height="60" rx="20" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
    <rect x="24" y="134" width="592" height="52" rx="16" fill="none" stroke="url(#neonOrangeGrad)" stroke-width="3" filter="url(#softGlow)"/>
    <text x="320" y="170" fill="#fb8500" font-size="28" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif" letter-spacing="4">3D AI VIRTUAL ASSISTANT</text>
  </g>

  <!-- VERY BOTTOM BADGE: "Bilingual Assistant & Voice Companion" -->
  <g transform="translate(250, 835)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="500" height="70" rx="35" fill="#0d1322" stroke="#f97316" stroke-width="4"/>
    <!-- Golden Mic Icon -->
    <g transform="translate(35, 15)">
      <rect x="12" y="5" width="12" height="22" rx="6" fill="#fbbf24"/>
      <path d="M 6 18 C 6 30 30 30 30 18" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
      <line x1="18" y1="28" x2="18" y2="36" stroke="#fbbf24" stroke-width="4"/>
      <line x1="10" y1="36" x2="26" y2="36" stroke="#fbbf24" stroke-width="4"/>
    </g>
    <!-- Text -->
    <text x="270" y="32" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="'Arial', sans-serif">Bilingual Assistant</text>
    <text x="270" y="56" fill="#fb8500" font-size="20" font-weight="700" text-anchor="middle" font-family="'Arial', sans-serif">&amp; Voice Companion</text>
  </g>
</svg>
