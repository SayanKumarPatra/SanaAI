<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Circle Background -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Orange Ring Gradient -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Face Skin Gradient -->
    <radialGradient id="skinTone" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="60%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Circular Base -->
  <circle cx="250" cy="250" r="240" fill="url(#badgeBg)" stroke="#0f172a" stroke-width="10"/>

  <!-- Glowing Neon Outer Ring Border -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#neonOrange)" stroke-width="12" filter="url(#orangeGlow)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5"/>

  <!-- Left Side Chat Bubble -->
  <g transform="translate(60, 190)">
    <rect x="0" y="0" width="80" height="60" rx="18" fill="#0f172a" stroke="#f97316" stroke-width="4" filter="url(#orangeGlow)"/>
    <path d="M 20 60 L 10 75 L 35 60 Z" fill="#0f172a" stroke="#f97316" stroke-width="4"/>
    <circle cx="25" cy="30" r="6" fill="#fbbf24"/>
    <circle cx="40" cy="30" r="6" fill="#fbbf24"/>
    <circle cx="55" cy="30" r="6" fill="#fbbf24"/>
  </g>

  <!-- Right Side Glowing 'S' Badge -->
  <g transform="translate(350, 190)">
    <circle cx="40" cy="40" r="40" fill="#0f172a" stroke="#f97316" stroke-width="4" filter="url(#orangeGlow)"/>
    <text x="40" y="58" fill="#fbbf24" font-size="52" font-weight="900" text-anchor="middle" font-family="Arial, sans-serif" filter="url(#orangeGlow)">S</text>
  </g>

  <!-- Center Character Avatar (SANA) -->
  <g transform="translate(110, 50)">
    <!-- Dark Ponytail Hair (Back) -->
    <path d="M 140 100 C 50 100 40 160 40 240 C 40 300 70 340 100 360 L 100 400 L 180 400 L 180 360 C 210 340 240 300 240 240 C 240 160 230 100 140 100 Z" fill="#0f172a"/>
    <!-- High Ponytail Strand -->
    <path d="M 180 120 C 240 70 280 100 270 180 C 260 210 230 220 200 190 Z" fill="#020617" stroke="#ea580c" stroke-width="3"/>

    <!-- Hoodie / Clothing Body -->
    <path d="M 50 350 C 70 300 100 280 140 280 C 180 280 210 300 230 350 L 250 420 C 220 440 60 440 30 420 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    
    <!-- Face / Skin -->
    <ellipse cx="140" cy="230" rx="60" ry="70" fill="url(#skinTone)"/>

    <!-- Eyes -->
    <ellipse cx="115" cy="225" rx="10" ry="14" fill="#0f172a"/>
    <circle cx="118" cy="220" r="4" fill="#ffffff"/>
    <ellipse cx="165" cy="225" rx="10" ry="14" fill="#0f172a"/>
    <circle cx="168" cy="220" r="4" fill="#ffffff"/>

    <!-- Eyelashes & Brows -->
    <path d="M 100 210 Q 115 200 130 212" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 150 212 Q 165 200 180 210" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cute Smile -->
    <path d="M 128 265 Q 140 278 152 265" stroke="#ea580c" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Headphones & Earcups -->
    <path d="M 75 220 C 70 140 210 140 205 220" stroke="#0f172a" stroke-width="12" fill="none"/>
    <rect x="65" y="200" width="22" height="50" rx="11" fill="#0f172a" stroke="#f97316" stroke-width="4"/>
    <rect x="193" y="200" width="22" height="50" rx="11" fill="#0f172a" stroke="#f97316" stroke-width="4"/>
    <circle cx="204" cy="225" r="8" fill="#fbbf24"/>

    <!-- Headset Microphone -->
    <path d="M 80 235 C 70 235 60 270 90 285 C 110 295 125 285 130 280" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#orangeGlow)"/>
    <circle cx="130" cy="280" r="8" fill="#f97316"/>
  </g>

  <!-- Bottom SANA Badge Text Banner -->
  <g transform="translate(100, 375)">
    <rect x="0" y="0" width="300" height="75" rx="22" fill="#020617" stroke="url(#neonOrange)" stroke-width="5" filter="url(#orangeGlow)"/>
    <text x="150" y="42" fill="#ffffff" font-size="38" font-weight="900" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" letterSpacing="4">SANA</text>
    <text x="150" y="62" fill="#fbbf24" font-size="14" font-weight="800" text-anchor="middle" font-family="'Arial', sans-serif" letterSpacing="2">3D AI VIRTUAL ASSISTANT</text>
  </g>
</svg>
